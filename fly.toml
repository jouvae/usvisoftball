# fly.toml app configuration file generated for softball on 2026-08-11T22:31:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'usvi-softball'
primary_region = 'ewr'

[build]

# Build-time feature flags (Dockerfile ARGs; `next build` inlines NEXT_PUBLIC_*). Teams +
# Events went live with the home-layout feature (docs/features/softball/home-layout/).
# Set a value to "false" (or delete it) and redeploy to switch a section off again.
[build.args]
  NEXT_PUBLIC_TEAMS_ENABLED = "true"
  NEXT_PUBLIC_EVENTS_ENABLED = "true"
  # Google Analytics 4 (public site only; see lib/flags.ts GA_MEASUREMENT_ID).
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-DS4Z8KKPNX"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
