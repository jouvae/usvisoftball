# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build on the runner (Docker is present on ubuntu-latest) and push to the app's
      # own registry. This keeps FLY_API_TOKEN a least-privilege APP-scoped deploy token:
      # a remote/depot builder is a separate org resource an app-scoped token can't start
      # ("Failed to start remote builder heartbeat: unauthorized"), but pushing to the
      # app's registry is authorized. The Dockerfile builds offline (all Supabase routes
      # are force-dynamic; fonts self-hosted), so no build-time secrets are needed.
      - run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
